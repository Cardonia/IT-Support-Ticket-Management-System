<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="welcome-box">

        <h2 id="ticket-title"></h2>

        <p id="ticket-description" class="ticket-description"></p>

        <ul id="ticket-details" class="ticket-list"></ul>

        <button id="take-button" hidden>Take Ticket</button>

        <button id="resolve-button" hidden>Mark Resolved</button>

        <div id="notes-box" hidden>

            <h3>Notes</h3>

            <ul id="note-list" class="ticket-list"></ul>

            <p id="notes-empty"></p>

        </div>

        <div id="note-form" hidden>

            <textarea id="note-body" rows="4" maxlength="2000" placeholder="Write a note"></textarea>

            <button id="note-button">Add Note</button>

        </div>

        <a href="/home.html" class="button">Back</a>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
