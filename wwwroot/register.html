<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="register-box">

        <h2>Register</h2>

        <!-- novalidate: script.js shows the same messages the server would (one source of wording).
             script.js listens for the submit event (no inline handler: the Content-Security-Policy
             forbids inline script). method="post": if script.js ever fails to load, the browser sends
             the form as a POST (the server refuses it with 403) instead of a GET that would put the
             password in the URL. -->
        <form id="register-form" method="post" novalidate>

            <label for="username">Username</label>
            <input id="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off"
                spellcheck="false" aria-describedby="username-hint">
            <p id="username-hint" class="field-hint">4-14 characters: letters, numbers or underscore.</p>

            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="new-password" aria-describedby="password-hint">
            <p id="password-hint" class="field-hint">At least 8 characters.</p>

            <label for="repassword">Re-enter password</label>
            <input id="repassword" type="password" autocomplete="new-password">

            <button id="register-button" type="submit">Register</button>

            <p id="message" role="alert"></p>

        </form>

    </div>

    <script src="script.js"></script>

</body>

</html>
