<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a56a8">
    <title>Register - IT Help Desk</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">IT</span>IT Help Desk</a>
        </div>
    </header>

    <main id="main" class="auth">

        <div class="panel">

            <h1>Create your account</h1>

            <!-- novalidate: script.js shows the same messages the server would (one source of wording).
                 script.js listens for the submit event (no inline handler: the Content-Security-Policy
                 forbids inline script). method="post": if script.js ever fails to load, the browser sends
                 the form as a POST (the server refuses it with 403) instead of a GET that would put the
                 password in the URL. -->
            <form id="register-form" method="post" novalidate>

                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off"
                        spellcheck="false" enterkeyhint="next" aria-describedby="username-hint">
                    <p id="username-hint" class="field-hint">4-14 characters: letters, numbers or underscore.</p>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" autocomplete="new-password" enterkeyhint="next"
                        aria-describedby="password-hint">
                    <p id="password-hint" class="field-hint">At least 8 characters.</p>
                </div>

                <div class="field">
                    <label for="repassword">Re-enter password</label>
                    <input id="repassword" type="password" autocomplete="new-password" enterkeyhint="go">
                </div>

                <button id="register-button" class="btn btn-block" type="submit">Register</button>

                <p id="message" role="alert"></p>

            </form>

        </div>

        <p class="auth-alt">Already registered? <a href="/login.html">Log in</a></p>

    </main>

    <script src="script.js"></script>

</body>

</html>
