<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a56a8">
    <title>Change password - IT Help Desk</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/home.html"><span class="brand-mark" aria-hidden="true">IT</span>IT Help Desk</a>
            <div class="topbar-user">
                <strong id="nav-user"></strong>
                <span id="nav-role"></span>
            </div>
            <button id="logout-button" class="btn btn-secondary" type="button">Log out</button>
        </div>
    </header>

    <main id="main" class="auth">

        <div class="panel">

            <h1>Change password</h1>

            <!-- Shown by script.js when the account still has a temporary password (an administrator created or reset it). -->
            <p id="forced-note" class="notice" hidden>You are using a temporary password. Choose your own password to continue.</p>

            <!-- novalidate: script.js shows the messages. method="post": if script.js ever fails to load, the browser
                 sends a POST (the server refuses it) instead of a GET that would put passwords in the address. -->
            <form id="change-form" method="post" novalidate>

                <div class="field">
                    <label for="current-password">Current password</label>
                    <input id="current-password" type="password" autocomplete="current-password" enterkeyhint="next">
                </div>

                <div class="field">
                    <label for="new-password">New password</label>
                    <input id="new-password" type="password" autocomplete="new-password" enterkeyhint="next">
                    <p class="field-hint">At least 8 characters.</p>
                </div>

                <div class="field">
                    <label for="repeat-password">Repeat new password</label>
                    <input id="repeat-password" type="password" autocomplete="new-password" enterkeyhint="go">
                </div>

                <button id="change-button" class="btn btn-block" type="submit">Change password</button>

                <p id="message" role="alert"></p>

            </form>

        </div>

        <p id="back-box" class="auth-alt"><a href="/home.html">Back</a></p>

    </main>

    <script src="script.js"></script>

</body>

</html>
