<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a56a8">
    <title>Log in - IT Help Desk</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">IT</span>IT Help Desk</a>
        </div>
    </header>

    <main id="main" class="auth">

        <div class="panel">

            <h1>Log in</h1>

            <!-- novalidate: script.js shows the messages. script.js listens for the submit event (no inline
                 handler: the Content-Security-Policy forbids inline script). method="post": if script.js
                 ever fails to load, the browser sends the form as a POST (the server refuses it with 403)
                 instead of a GET that would put the password in the URL. -->
            <form id="login-form" method="post" novalidate>

                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off"
                        spellcheck="false" enterkeyhint="next">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" autocomplete="current-password" enterkeyhint="go">
                </div>

                <button id="login-button" class="btn btn-block" type="submit">Log in</button>

                <p id="message" role="alert"></p>

            </form>

        </div>

        <p class="auth-alt">No account yet? <a href="/register.html">Register</a></p>

    </main>

    <script src="script.js"></script>

</body>

</html>
