<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="register-box">

        <h2>Login</h2>

        <!-- Same pattern as register.html. novalidate: script.js shows the messages. script.js listens for
             the submit event (no inline handler: the Content-Security-Policy forbids inline script).
             method="post": if script.js ever fails to load, the browser sends the form as a POST (the
             server refuses it with 403) instead of a GET that would put the password in the URL. -->
        <form id="login-form" method="post" novalidate>

            <label for="username">Username</label>
            <input id="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off"
                spellcheck="false">

            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password">

            <button id="login-button" type="submit">Login</button>

            <p id="message" role="alert"></p>

        </form>

    </div>

    <script src="script.js"></script>

</body>

</html>
